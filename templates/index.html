<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrado y Círculo</title>
    <!-- Ruta adaptada para la carpeta static/css -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div id="cuadrado">
        <div id="circulo">
            <span id="contador-numero">0</span>
        </div>
        <!-- Barras negras en los bordes del mapa -->
        <div class="barra barra-top"></div>
        <div class="barra barra-bottom"></div>
        <div class="barra barra-left"></div>
        <div class="barra barra-right"></div>
    </div>

    <!-- Minimapa fijo en la esquina superior derecha -->
    <div id="minimapa">
        <div id="minimapa-viewport"></div>
        <div id="minimapa-circulo"></div>
    </div>

    <!-- Ruta adaptada para la carpeta static/js -->
    <script src="../static/js/script.js"></script>
</body>
</html>
